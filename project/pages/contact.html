<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Novus Foundation</title>
    <meta name="description" content="Get in touch with Novus Foundation for inquiries about our programs, events, or partnership opportunities.">
    <link rel="stylesheet" href="../styles/main.css">
    <script src="../scripts/main.js" defer></script>
</head>
<body>
    <header>
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="programs.html">Programs</a></li>
                <li><a href="events.html">Events</a></li>
                <li><a href="success-stories.html">Success Stories</a></li>
                <li><a href="resources.html">Resources</a></li>
                <li><a  href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        
        <section id="contact-form">
            <h2>Send Us a Message</h2>
            <form id="message-form">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="subject">Subject:</label>
                <select id="subject" name="subject" required>
                    <option value="">Select a subject</option>
                    <option value="program-inquiry">Program Inquiry</option>
                    <option value="partnership">Partnership Opportunity</option>
                    <option value="volunteer">Volunteer Interest</option>
                    <option value="other">Other</option>
                </select>

                <label for="message">Message:</label>
                <textarea id="message" name="message" required></textarea>

                <button type="submit">Send Message</button>
            </form>
        </section>

        <section id="contact-info">
            <h2>Other Ways to Reach Us</h2>
            <p>Email: info@novusfoundation.org</p>
            <p>Phone: (555) 123-4567</p>
            <p>Address: 123 Innovation Street, Tech City, TC 12345</p>
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Novus Foundation. All rights reserved.</p>
        <form id="newsletter-form">
            <label for="newsletter-email">Subscribe to our newsletter:</label>
            <input type="email" id="newsletter-email" name="newsletter-email" required>
            <button type="submit">Subscribe</button>
        </form>
    </footer>
</body>
</html>
